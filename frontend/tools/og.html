<!doctype html><meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Allura&family=Amiri:wght@400;700&family=Cinzel:wght@400;500;600&family=Cormorant+Garamond:ital,wght@0,500;1,400&display=swap">
<style>
*{box-sizing:border-box;margin:0}
html,body{width:1200px;height:630px;overflow:hidden}
body{position:relative;font-family:"Cormorant Garamond",serif;color:#4a3420;
  background:radial-gradient(60% 75% at 50% 48%,#fffaf0 0%,#f6eedd 55%,#e6d8bc 100%)}
.noise{position:absolute;inset:0;opacity:.5;mix-blend-mode:multiply}
.b1{position:absolute;inset:22px;border:2px solid #b08a45;border-radius:6px}
.b2{position:absolute;inset:32px;border:1px solid #b08a4590;border-radius:3px}
.corner{position:absolute;width:150px;height:150px}
.corner.tl{left:14px;top:14px}.corner.tr{right:14px;top:14px;transform:scaleX(-1)}
.corner.bl{left:14px;bottom:14px;transform:scaleY(-1)}.corner.br{right:14px;bottom:14px;transform:scale(-1,-1)}
.side{position:absolute;top:50%;width:150px;height:330px;transform:translateY(-50%)}
.side.l{left:112px}.side.r{right:112px;transform:translateY(-50%) scaleX(-1)}
.mid{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;text-align:center;padding-top:6px}
.gold{background:linear-gradient(100deg,#7a5626,#a67c3d 25%,#d9b872 48%,#a67c3d 66%,#7a5626);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 1.5px 0 #fff) drop-shadow(0 -1px 0 #7a562650)}
.ar{font:400 44px/1.5 "Amiri",serif;direction:rtl}
.eye{font:500 17px "Cinzel",serif;letter-spacing:.42em;color:#a67c3d;text-transform:uppercase;margin-top:2px}
.names{font:400 132px/1.25 "Allura",cursive;padding:0 .2em;margin:-14px 0 -18px}
.names small{font-size:.58em}
.what{font:600 27px "Cinzel",serif;letter-spacing:.34em;color:#4a3420;text-transform:uppercase}
.when{font:italic 400 30px "Cormorant Garamond",serif;color:#6b4f3a}
.orn{width:300px;height:24px;margin:2px 0}
</style>
<svg class="noise" width="1200" height="630"><filter id="n"><feTurbulence type="fractalNoise" baseFrequency=".8" numOctaves="2" seed="3"/><feColorMatrix values="0 0 0 0 .55  0 0 0 0 .45  0 0 0 0 .3  0 0 0 .35 -.08"/></filter><rect width="1200" height="630" filter="url(#n)"/></svg>
<div class="b1"></div><div class="b2"></div>

  <ellipse cx="38" cy="224" rx="18" ry="7" transform="rotate(-112 38 224)"/><ellipse cx="70" cy="230" rx="18" ry="7" transform="rotate(-68 70 230)"/>

  <circle cx="75" cy="10" r="4" fill="#a67c3d" stroke="none"/><circle cx="75" cy="320" r="4" fill="#a67c3d" stroke="none"/>

<svg class="corner tl" viewBox="0 0 150 150"><use href="#cr"/></svg><svg class="corner tr" viewBox="0 0 150 150"><use href="#cr"/></svg>
<svg class="corner bl" viewBox="0 0 150 150"><use href="#cr"/></svg><svg class="corner br" viewBox="0 0 150 150"><use href="#cr"/></svg>
<svg class="side l" viewBox="0 0 150 330"><use href="#sd"/></svg><svg class="side r" viewBox="0 0 150 330"><use href="#sd"/></svg>

  <p class="eye">You are cordially invited</p>
